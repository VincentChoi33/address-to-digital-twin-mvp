<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NVIDIA ovstream Address Twin Viewer</title>
  </head>
  <body>
    <main class="viewer-shell">
      <section class="viewport" aria-label="NVIDIA ovstream video viewport">
        <video id="remote-video" muted autoplay playsinline></video>
        <audio id="remote-audio" autoplay></audio>
        <div class="overlay top-left">
          <strong>NVIDIA ovstream Direct</strong>
          <span id="status">idle</span>
        </div>
        <div class="overlay bottom-left" id="metrics">waiting for video</div>
      </section>
      <aside class="panel">
        <h1>Address Twin NVIDIA Viewer</h1>
        <p>This client displays only the <code>ovstream</code> WebRTC video track produced by an NVIDIA ovrtx server.</p>
        <label>Server <input id="server" /></label>
        <label>Signaling port <input id="signaling-port" type="number" min="1" max="65535" /></label>
        <button id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
        <pre id="events"></pre>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
