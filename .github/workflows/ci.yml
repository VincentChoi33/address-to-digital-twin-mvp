name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sample pipeline smoke (offline fallback)
        run: npm run sample:sadang

      - name: NVIDIA Omniverse export smoke
        run: |
          npm run export:omniverse
          npm run nvidia:preflight
          test -s src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          test -s src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'metersPerUnit = 1' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'MaterialBindingAPI' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'openusd_authoring_ready' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
