name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sample pipeline smoke (offline fallback)
        run: npm run sample:sadang

      - name: NVIDIA Omniverse export smoke
        run: |
          npm run nvidia:package
          test -s src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          test -s src/samples/sadang_317_6/omniverse/sadang_317_6.ovrtx_viewer.usda
          test -s src/samples/sadang_317_6/omniverse/nvidia_ovrtx_first_frame.py
          test -s src/samples/sadang_317_6/omniverse/nvidia_ovstream_smoke_server.py
          test -s src/samples/sadang_317_6/omniverse/nvidia_warp_flood_smoke.py
          test -s src/samples/sadang_317_6/omniverse/ovstream_browser_client/package.json
          test -s src/samples/sadang_317_6/omniverse/ovstream_browser_client/src/main.ts
          test -s src/samples/sadang_317_6/omniverse/ovstream_browser_client/scripts/probe-first-frame.mjs
          test -s src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          test -s src/samples/sadang_317_6/omniverse/handoff_manifest.json
          test -s src/samples/sadang_317_6/omniverse/NVIDIA_GPU_HOST_RUNBOOK.md
          test -s src/samples/sadang_317_6/omniverse/ovstream_viewer_contract.json
          test -s src/samples/sadang_317_6/omniverse/OVSTREAM_VIEWER_RUNBOOK.md
          test -s src/samples/sadang_317_6/omniverse/simready_asset/sadang_317_6/simready_usd/sadang_317_6.usda
          test -s src/samples/sadang_317_6/omniverse/simready_asset/sadang_317_6/simready_usd/sadang_317_6.json
          grep -q 'metersPerUnit = 1' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'MaterialBindingAPI' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'PhysicsScene' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'PhysicsCollisionAPI' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'PhysicsMassAPI' src/samples/sadang_317_6/omniverse/sadang_317_6.usda
          grep -q 'SimReady_Metadata' src/samples/sadang_317_6/omniverse/simready_asset/sadang_317_6/simready_usd/sadang_317_6.usda
          grep -q 'RenderProduct "ViewportTexture0"' src/samples/sadang_317_6/omniverse/sadang_317_6.ovrtx_viewer.usda
          grep -q 'RenderVar "LdrColor"' src/samples/sadang_317_6/omniverse/sadang_317_6.ovrtx_viewer.usda
          grep -q 'RendererConfig' src/samples/sadang_317_6/omniverse/nvidia_ovrtx_first_frame.py
          grep -q 'VideoFrame.from_cuda_array' src/samples/sadang_317_6/omniverse/nvidia_ovstream_smoke_server.py
          grep -q 'shallow_water_step' src/samples/sadang_317_6/omniverse/nvidia_warp_flood_smoke.py
          grep -q '@wp.kernel' src/samples/sadang_317_6/omniverse/nvidia_warp_flood_smoke.py
          grep -q 'flooded_area_gt_10cm' src/samples/sadang_317_6/omniverse/nvidia_warp_flood_smoke.py
          grep -q '@nvidia/ov-web-rtc' src/samples/sadang_317_6/omniverse/ovstream_browser_client/package.json
          grep -q 'probe:first-frame' src/samples/sadang_317_6/omniverse/ovstream_browser_client/package.json
          grep -q 'StreamType.DIRECT' src/samples/sadang_317_6/omniverse/ovstream_browser_client/src/main.ts
          grep -q 'document.body.dataset.firstVideoFrame' src/samples/sadang_317_6/omniverse/ovstream_browser_client/scripts/probe-first-frame.mjs
          grep -q 'openusd_authoring_ready' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'OMNIVERSE.OVSTREAM.001' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'NVIDIA.WARP_FLOOD.001' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'CONTENT_AGENTS.ENDPOINTS.001' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'SIMREADY.VALIDATOR.001' src/samples/sadang_317_6/omniverse/nvidia_runtime_preflight.json
          grep -q 'ready_for_gpu_host' src/samples/sadang_317_6/omniverse/handoff_manifest.json
          grep -q 'nvidia:content-agents:deploy:plan' src/samples/sadang_317_6/omniverse/NVIDIA_GPU_HOST_RUNBOOK.md
          grep -q 'nvidia:content-agents:deploy -- up' src/samples/sadang_317_6/omniverse/NVIDIA_GPU_HOST_RUNBOOK.md
          grep -q 'nvidia:content-agents:deploy:plan' src/samples/sadang_317_6/omniverse/README.md
          grep -q 'video_stream_only' src/samples/sadang_317_6/omniverse/ovstream_viewer_contract.json
          grep -q 'Three.js' src/samples/sadang_317_6/omniverse/ovstream_viewer_contract.json


      - name: NVIDIA Python runner syntax
        run: |
          python3 -m py_compile \
            scripts/nvidia_acceptance.py \
            scripts/nvidia_content_agents.py \
            scripts/nvidia_content_agents_deploy.py \
            scripts/nvidia_finish.py \
            scripts/nvidia_register_key.py \
            scripts/nvidia_remote_finish.py \
            scripts/nvidia_simready_validate.py \
            scripts/nvidia_warp_flood_smoke.py

      - name: NVIDIA Warp flood blocked-gate audit
        run: |
          python3 src/samples/sadang_317_6/omniverse/nvidia_warp_flood_smoke.py --allow-missing --output-json "$RUNNER_TEMP/warp-flood.json" --output-pgm "$RUNNER_TEMP/warp-flood.pgm"
          grep -Eq '"status": "(blocked|passed)"' "$RUNNER_TEMP/warp-flood.json"

      - name: NVIDIA SimReady profile validation
        run: |
          NVIDIA_SIMREADY_AUTO_INSTALL=1 NVIDIA_SIMREADY_AUTO_CLONE=1 NVIDIA_SIMREADY_FOUNDATION_REF=a1e9dd68ee2d107f74dc6cd6da875b54ad3f8fd3 \
            npm run nvidia:simready -- \
              --output-json "$RUNNER_TEMP/nvidia-simready-validation.json" \
              --output-md "$RUNNER_TEMP/nvidia-simready-validation.md"
          grep -q '"status": "passed"' "$RUNNER_TEMP/nvidia-simready-validation.json"
          grep -q 'FET006_BASE_MDL' "$RUNNER_TEMP/nvidia-simready-validation.json"

      - name: NVIDIA Content Agents blocked-gate audit
        run: |
          npm run nvidia:content-agents:deploy-audit -- \
            --skip-docker-gpu-smoke \
            --output-json "$RUNNER_TEMP/nvidia-content-agents-deploy.json" \
            --output-md "$RUNNER_TEMP/nvidia-content-agents-deploy.md"
          grep -Eq '"status": "(blocked|ready)"' "$RUNNER_TEMP/nvidia-content-agents-deploy.json"
          npm run nvidia:content-agents:deploy:plan -- \
            --skip-docker-gpu-smoke \
            --output-json "$RUNNER_TEMP/nvidia-content-agents-deploy-plan.json" \
            --output-md "$RUNNER_TEMP/nvidia-content-agents-deploy-plan.md"
          grep -Eq '"status": "(blocked|ready_to_deploy)"' "$RUNNER_TEMP/nvidia-content-agents-deploy-plan.json"
          grep -q 'NVIDIA_API_KEY or NVIDIA_API_KEY_FILE is required' "$RUNNER_TEMP/nvidia-content-agents-deploy-plan.json"
          npm run nvidia:content-agents:deploy:status -- \
            --output-json "$RUNNER_TEMP/nvidia-content-agents-deploy-status.json" \
            --output-md "$RUNNER_TEMP/nvidia-content-agents-deploy-status.md"
          grep -Eq '"status": "(blocked|ready|warming)"' "$RUNNER_TEMP/nvidia-content-agents-deploy-status.json"
          grep -q 'material endpoint is not healthy' "$RUNNER_TEMP/nvidia-content-agents-deploy-status.json"
          npm run nvidia:content-agents:check -- \
            --output-json "$RUNNER_TEMP/nvidia-content-agents.json" \
            --output-md "$RUNNER_TEMP/nvidia-content-agents.md"
          grep -q '"status": "blocked"' "$RUNNER_TEMP/nvidia-content-agents.json"
          grep -q 'Missing Material Agent endpoint' "$RUNNER_TEMP/nvidia-content-agents.json"
          grep -q 'Missing NVIDIA_API_KEY for deploying missing Content Agents services' "$RUNNER_TEMP/nvidia-content-agents.json"

      - name: NVIDIA-only acceptance certificate
        run: |
          npm run nvidia:acceptance:check -- \
            --output-json "$RUNNER_TEMP/nvidia-acceptance.json" \
            --output-md "$RUNNER_TEMP/nvidia-acceptance.md"
          grep -q '"status": "passed"' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q 'VIEWER.NO_WEBGL.001' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q 'OMNIVERSE.OVSTREAM_BROWSER.001' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q 'NVIDIA.WARP_FLOOD.001' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q 'SIMREADY.VALIDATOR.001' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q 'CONTENT_AGENTS.RUNTIME.001' "$RUNNER_TEMP/nvidia-acceptance.json"
          grep -q '"failures": \\[\\]' "$RUNNER_TEMP/nvidia-acceptance.json"

      - name: NVIDIA one-shot finish gate
        run: |
          npm run nvidia:finish:check -- \
            --output-json "$RUNNER_TEMP/nvidia-finish.json" \
            --output-md "$RUNNER_TEMP/nvidia-finish.md" \
            --scratch-dir "$RUNNER_TEMP/nvidia-finish"
          grep -q '"status": "blocked"' "$RUNNER_TEMP/nvidia-finish.json"
          grep -q 'content-agents-run' "$RUNNER_TEMP/nvidia-finish.json"
          grep -q 'nvidia-acceptance' "$RUNNER_TEMP/nvidia-finish.json"
          grep -q 'NVIDIA_API_KEY' "$RUNNER_TEMP/nvidia-finish.json"
